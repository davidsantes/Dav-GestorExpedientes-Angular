<section class="filtros">
  <div class="filtros-header">
    <div>
      <p class="eyebrow">Gestión documental</p>
      <h1>Buscar expedientes</h1>
    </div>
  </div>

  <form class="filtros-form" (ngSubmit)="buscar()">
    <div class="campo campo-expediente">
      <mat-form-field appearance="outline">
        <mat-label>Nº expediente</mat-label>
        <input
          id="numero-expediente"
          matInput
          name="numero"
          type="search"
          [(ngModel)]="filtro.numero"
          placeholder="Ej.: EXP-2026-0001"
        >
      </mat-form-field>
    </div>

    <div class="campo">
      <mat-form-field appearance="outline">
        <mat-label>Estado</mat-label>
        <mat-select id="estado" name="estado" [(ngModel)]="filtro.estado">
          <mat-option value="">Todos los estados</mat-option>
          @for (estado of estados(); track estado) {
            <mat-option [value]="estado">{{ estado }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="campo">
      <mat-form-field appearance="outline">
        <mat-label>Prioridad</mat-label>
        <mat-select id="prioridad" name="prioridad" [(ngModel)]="filtro.prioridad">
          <mat-option value="">Todas las prioridades</mat-option>
          @for (prioridad of prioridades(); track prioridad) {
            <mat-option [value]="prioridad">{{ prioridad }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="campo">
      <mat-form-field appearance="outline">
        <mat-label>Fecha inicio</mat-label>
        <input id="fecha-inicio" matInput name="fechaInicio" [matDatepicker]="selectorFechaInicio" [(ngModel)]="fechaInicio">
        <mat-datepicker-toggle matIconSuffix [for]="selectorFechaInicio"></mat-datepicker-toggle>
        <mat-datepicker #selectorFechaInicio></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="campo">
      <mat-form-field appearance="outline">
        <mat-label>Fecha fin</mat-label>
        <input id="fecha-fin" matInput name="fechaFin" [matDatepicker]="selectorFechaFin" [(ngModel)]="fechaFin">
        <mat-datepicker-toggle matIconSuffix [for]="selectorFechaFin"></mat-datepicker-toggle>
        <mat-datepicker #selectorFechaFin></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="acciones">
      <button
        matButton="outlined"
        type="button"
        class="secondary-button"
        (click)="limpiar()"
      >
        Limpiar
      </button>

      <button
        matButton="filled"
        type="submit"
        class="primary-button"
      >
        Buscar
      </button>
    </div>
  </form>
</section>
