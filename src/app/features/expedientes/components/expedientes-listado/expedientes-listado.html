<section class="resultados">
  <div class="table-wrapper">
    <table mat-table [dataSource]="expedientesOrdenados()" matSort (matSortChange)="ordenar($event)">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="numero">
          <mat-icon aria-hidden="true">folder_open</mat-icon>
          <span>Nº expediente</span>
        </th>
        <td mat-cell *matCellDef="let expediente" class="numero">{{ expediente.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="titulo">
          <mat-icon aria-hidden="true">subject</mat-icon>
          <span>Título</span>
        </th>
        <td mat-cell *matCellDef="let expediente">{{ expediente.titulo }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="estado">
          <mat-icon aria-hidden="true">task_alt</mat-icon>
          <span>Estado</span>
        </th>
        <td mat-cell *matCellDef="let expediente">
              <span
                class="badge estado"
                [class.pendiente]="expediente.estado === 'pendiente'"
                [class.tramite]="expediente.estado === 'tramite'"
                [class.finalizado]="expediente.estado === 'finalizado'"
                [class.archivado]="expediente.estado === 'archivado'"
              >
                {{ expediente.estado }}
              </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="prioridad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="prioridad">
          <mat-icon aria-hidden="true">priority_high</mat-icon>
          <span>Prioridad</span>
        </th>
        <td mat-cell *matCellDef="let expediente">
              <span
                class="badge prioridad"
                [class.alta]="expediente.prioridad === 'alta'"
                [class.media]="expediente.prioridad === 'media'"
                [class.baja]="expediente.prioridad === 'baja'"
              >
                {{ expediente.prioridad }}
              </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="fechaAlta">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="fechaAlta">
          <mat-icon aria-hidden="true">calendar_today</mat-icon>
          <span>Fecha alta</span>
        </th>
        <td mat-cell *matCellDef="let expediente">{{ expediente.fechaAlta }}</td>
      </ng-container>

      <ng-container matColumnDef="opciones">
        <th mat-header-cell *matHeaderCellDef>
          <mat-icon aria-hidden="true">visibility</mat-icon>
          <span>Opciones</span>
        </th>
        <td mat-cell *matCellDef="let expediente">
              <button
                matButton="outlined"
                type="button"
                class="edit-button"
                (click)="seleccionar(expediente)"
              >
                Consultar
              </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </div>
</section>
