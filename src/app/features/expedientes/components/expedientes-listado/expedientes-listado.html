<section class="resultados">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Nº expediente</th>
          <th>Título</th>
          <th>Estado</th>
          <th>Prioridad</th>
          <th>Fecha alta</th>
          <th>Opciones</th>
        </tr>
      </thead>

      <tbody>
        @for (expediente of expedientes; track expediente.numero) {
          <tr>
            <td class="numero" data-label="Nº expediente">{{ expediente.numero }}</td>
            <td data-label="Título">{{ expediente.titulo }}</td>
            <td data-label="Estado">
              <span
                class="badge estado"
                [class.pendiente]="expediente.estado === 'pendiente'"
                [class.tramite]="expediente.estado === 'tramite'"
                [class.finalizado]="expediente.estado === 'finalizado'"
                [class.archivado]="expediente.estado === 'archivado'"
              >
                {{ expediente.estado }}
              </span>
            </td>
            <td data-label="Prioridad">
              <span
                class="badge prioridad"
                [class.alta]="expediente.prioridad === 'alta'"
                [class.media]="expediente.prioridad === 'media'"
                [class.baja]="expediente.prioridad === 'baja'"
              >
                {{ expediente.prioridad }}
              </span>
            </td>
            <td data-label="Fecha alta">{{ expediente.fechaAlta }}</td>
            <td data-label="Opciones">
              <button
                type="button"
                class="edit-button"
                (click)="seleccionar(expediente)"
              >
                Consultar
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
