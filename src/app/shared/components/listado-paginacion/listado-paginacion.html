<div class="paginacion-container">
  
  <button 
    class="paginacion-btn"
    [disabled]="primeraPagina()" 
    (click)="navegarAPagina(paginaActual() - 1)">
    Anterior
  </button>

  <span class="paginacion-info">
    Pagina {{ paginaActual() }} de {{ totalPaginas() }}
  </span>

  <button 
    class="paginacion-btn"
    [disabled]="ultimaPagina()" 
    (click)="navegarAPagina(paginaActual() + 1)">
    Siguiente
  </button>

</div>
